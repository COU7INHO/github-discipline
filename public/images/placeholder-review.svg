<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="1200" height="720" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="60" fill="#161b22"/>
  <text x="40" y="36" fill="#e6edf3" font-size="14">Files changed · #124</text>

  <!-- file header -->
  <rect x="40" y="90" width="1120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="115" fill="#e6edf3" font-size="13" font-family="monospace">src/exports/users.py</text>
  <text x="1140" y="115" fill="#7d8590" font-size="12" text-anchor="end" font-family="monospace">+48 −3</text>

  <!-- diff -->
  <g font-family="monospace" font-size="13">
