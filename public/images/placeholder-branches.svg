  <rect x="32" y="108" width="60" height="2" fill="#f78166"/>
  <text x="120" y="100" fill="#7d8590" font-size="13">Stale</text>
  <text x="180" y="100" fill="#7d8590" font-size="13">All</text>
  <line x1="0" y1="110" x2="1200" y2="110" stroke="#30363d"/>

  <!-- branch entries -->
  <g font-size="14">
    <!-- main -->
    <rect x="40" y="140" width="1120" height="60" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="170" fill="#e6edf3" font-weight="600">main</text>
    <rect x="120" y="155" width="58" height="22" rx="11" fill="#3fb95033" stroke="#3fb95055"/>
    <text x="149" y="170" fill="#3fb950" font-size="11" text-anchor="middle">default</text>
    <rect x="184" y="155" width="60" height="22" rx="11" fill="#21262d" stroke="#30363d"/>
    <text x="214" y="170" fill="#7d8590" font-size="11" text-anchor="middle">protected</text>
    <text x="60" y="190" fill="#7d8590" font-size="12">Updated 2 days ago by @lead</text>

    <!-- development -->
    <rect x="40" y="210" width="1120" height="60" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="240" fill="#e6edf3" font-weight="600">development</text>
    <rect x="180" y="225" width="60" height="22" rx="11" fill="#58a6ff33" stroke="#58a6ff55"/>
    <text x="210" y="240" fill="#58a6ff" font-size="11" text-anchor="middle">integration</text>
    <rect x="246" y="225" width="60" height="22" rx="11" fill="#21262d" stroke="#30363d"/>
    <text x="276" y="240" fill="#7d8590" font-size="11" text-anchor="middle">protected</text>
    <text x="60" y="260" fill="#7d8590" font-size="12">Updated 14 minutes ago · 5 ahead of main</text>

    <!-- feature/123 -->
    <rect x="40" y="280" width="1120" height="60" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="310" fill="#e6edf3" font-weight="600">feature/123-add-export-csv</text>
    <rect x="320" y="295" width="74" height="22" rx="11" fill="#bc8cff33" stroke="#bc8cff55"/>
    <text x="357" y="310" fill="#bc8cff" font-size="11" text-anchor="middle">@maria</text>
    <text x="60" y="330" fill="#7d8590" font-size="12">3 ahead, 1 behind development · #123</text>
    <rect x="1040" y="294" width="100" height="28" rx="6" fill="#238636"/>
    <text x="1090" y="312" fill="white" font-size="12" text-anchor="middle">Open PR</text>

    <!-- fix/156 -->
    <rect x="40" y="350" width="1120" height="60" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="380" fill="#e6edf3" font-weight="600">fix/156-null-pointer-on-login</text>
    <rect x="320" y="365" width="60" height="22" rx="11" fill="#bc8cff33" stroke="#bc8cff55"/>
    <text x="350" y="380" fill="#bc8cff" font-size="11" text-anchor="middle">@joao</text>
    <text x="60" y="400" fill="#7d8590" font-size="12">1 ahead of development · #156</text>

    <!-- chore/upgrade -->
    <rect x="40" y="420" width="1120" height="60" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="450" fill="#e6edf3" font-weight="600">chore/192-bump-dependencies</text>
    <rect x="320" y="435" width="60" height="22" rx="11" fill="#bc8cff33" stroke="#bc8cff55"/>
    <text x="350" y="450" fill="#bc8cff" font-size="11" text-anchor="middle">@ana</text>
    <text x="60" y="470" fill="#7d8590" font-size="12">8 ahead of development · #192</text>
  </g>

  <text x="600" y="680" fill="#3d444d" font-size="11" text-anchor="middle" font-family="monospace" letter-spacing="2">PLACEHOLDER · REPLACE WITH GITHUB SCREENSHOT</text>
