<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="1200" height="720" fill="#0d1117"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#161b22"/>
  <rect x="20" y="20" width="20" height="20" rx="4" fill="#7d8590"/>
  <text x="55" y="35" fill="#e6edf3" font-size="14">your-org / your-repo</text>
  <rect x="200" y="18" width="60" height="24" rx="3" fill="#21262d" stroke="#30363d"/>
  <text x="230" y="34" fill="#e6edf3" font-size="11" text-anchor="middle">Public</text>

  <!-- tabs -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#30363d"/>
  <text x="40" y="90" fill="#e6edf3" font-size="13" font-weight="600">Code</text>
  <rect x="36" y="98" width="40" height="2" fill="#f78166"/>
  <text x="100" y="90" fill="#7d8590" font-size="13">Issues 12</text>
  <text x="170" y="90" fill="#7d8590" font-size="13">Pull requests 3</text>
  <text x="270" y="90" fill="#7d8590" font-size="13">Actions</text>

  <!-- file list -->
  <rect x="40" y="140" width="800" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
  <circle cx="65" cy="165" r="9" fill="#bc8cff"/>
  <text x="85" y="170" fill="#e6edf3" font-size="13">main</text>
  <rect x="170" y="155" width="80" height="22" rx="11" fill="#21262d"/>
  <text x="210" y="170" fill="#e6edf3" font-size="11" text-anchor="middle">3 branches</text>
  <text x="700" y="170" fill="#7d8590" font-size="12">Go to file</text>
  <rect x="770" y="152" width="60" height="28" rx="6" fill="#238636"/>
  <text x="800" y="170" fill="white" font-size="12" text-anchor="middle">Code</text>

  <!-- README and files -->
  <g font-size="13">
    <rect x="40" y="210" width="800" height="44" fill="#0d1117" stroke="#30363d"/>
    <text x="60" y="237" fill="#58a6ff">📄 .github/</text>
    <text x="220" y="237" fill="#7d8590">issue and PR templates</text>
    <text x="780" y="237" fill="#7d8590" text-anchor="end">2 days ago</text>

    <rect x="40" y="254" width="800" height="44" fill="#0d1117" stroke="#30363d"/>
    <text x="60" y="281" fill="#58a6ff">📄 src/</text>
    <text x="220" y="281" fill="#7d8590">application source</text>
    <text x="780" y="281" fill="#7d8590" text-anchor="end">1 hour ago</text>

    <rect x="40" y="298" width="800" height="44" fill="#0d1117" stroke="#30363d"/>
    <text x="60" y="325" fill="#58a6ff">📄 tests/</text>
    <text x="220" y="325" fill="#7d8590">test suite</text>
    <text x="780" y="325" fill="#7d8590" text-anchor="end">1 hour ago</text>

    <rect x="40" y="342" width="800" height="44" fill="#0d1117" stroke="#30363d"/>
    <text x="60" y="369" fill="#e6edf3">.gitignore</text>
    <text x="780" y="369" fill="#7d8590" text-anchor="end">2 days ago</text>

    <rect x="40" y="386" width="800" height="44" fill="#0d1117" stroke="#30363d"/>
    <text x="60" y="413" fill="#e6edf3">CONTRIBUTING.md</text>
    <text x="780" y="413" fill="#7d8590" text-anchor="end">2 days ago</text>

    <rect x="40" y="430" width="800" height="44" fill="#0d1117" stroke="#30363d"/>
    <text x="60" y="457" fill="#e6edf3">LICENSE</text>
    <text x="780" y="457" fill="#7d8590" text-anchor="end">2 days ago</text>

    <rect x="40" y="474" width="800" height="44" fill="#0d1117" stroke="#30363d"/>
    <text x="60" y="501" fill="#e6edf3">README.md</text>
    <text x="220" y="501" fill="#7d8590">Project overview, setup, conventions</text>
    <text x="780" y="501" fill="#7d8590" text-anchor="end">3 hours ago</text>
  </g>

  <!-- right column / About -->
  <rect x="870" y="140" width="290" height="180" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="890" y="170" fill="#e6edf3" font-size="14" font-weight="600">About</text>
  <text x="890" y="195" fill="#7d8590" font-size="12">A well-structured repository</text>
  <text x="890" y="212" fill="#7d8590" font-size="12">that documents itself.</text>
  <rect x="890" y="230" width="80" height="22" rx="11" fill="#1f6feb33" stroke="#1f6feb55"/>
  <text x="930" y="245" fill="#58a6ff" font-size="11" text-anchor="middle">documentation</text>
  <rect x="980" y="230" width="60" height="22" rx="11" fill="#bc8cff33" stroke="#bc8cff55"/>
  <text x="1010" y="245" fill="#bc8cff" font-size="11" text-anchor="middle">team</text>

  <!-- placeholder watermark -->
  <text x="600" y="680" fill="#3d444d" font-size="11" text-anchor="middle" font-family="monospace" letter-spacing="2">PLACEHOLDER · REPLACE WITH GITHUB SCREENSHOT</text>
</svg>
