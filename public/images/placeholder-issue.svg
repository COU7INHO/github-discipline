<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="1200" height="720" fill="#0d1117"/>

  <!-- header -->
  <rect x="0" y="0" width="1200" height="60" fill="#161b22"/>
  <text x="40" y="36" fill="#e6edf3" font-size="14">your-org / your-repo</text>

  <!-- title -->
  <text x="40" y="115" fill="#e6edf3" font-size="26" font-weight="400">Export user activity to CSV</text>
  <text x="40" y="145" fill="#7d8590" font-size="14">#123 · opened 2 hours ago by @maria</text>

  <!-- status -->
  <rect x="40" y="170" width="80" height="32" rx="16" fill="#1f6feb"/>
  <circle cx="60" cy="186" r="6" fill="white"/>
  <text x="105" y="190" fill="white" font-size="13" text-anchor="middle">Open</text>

  <!-- main body -->
  <rect x="40" y="220" width="800" height="380" rx="6" fill="#0d1117" stroke="#30363d"/>
  <rect x="40" y="220" width="800" height="36" fill="#161b22" stroke="#30363d"/>
  <circle cx="62" cy="238" r="10" fill="#bc8cff"/>
  <text x="82" y="242" fill="#e6edf3" font-size="13">maria <tspan fill="#7d8590">opened this 2 hours ago</tspan></text>

  <g font-size="13" fill="#e6edf3">
    <text x="60" y="290" font-weight="600">Context</text>
    <text x="60" y="312" fill="#b8c0c9">The support team manually exports user activity logs every</text>
    <text x="60" y="330" fill="#b8c0c9">week. We need a self-service export from the admin panel.</text>

    <text x="60" y="370" font-weight="600">Acceptance Criteria</text>
    <text x="60" y="392" fill="#3fb950">☑</text>
    <text x="80" y="392" fill="#b8c0c9">Admin can select date range and download CSV</text>
    <text x="60" y="412" fill="#3fb950">☑</text>
    <text x="80" y="412" fill="#b8c0c9">Export respects user permissions</text>
    <text x="60" y="432" fill="#3fb950">☑</text>
    <text x="80" y="432" fill="#b8c0c9">File includes header row and UTF-8 BOM</text>

    <text x="60" y="476" font-weight="600">Out of scope</text>
    <text x="60" y="498" fill="#b8c0c9">JSON export — separate issue if needed</text>

    <text x="60" y="538" font-weight="600">Notes</text>
    <text x="60" y="560" fill="#b8c0c9">Likely needs a background job for large ranges.</text>
  </g>

  <!-- sidebar -->
  <rect x="870" y="220" width="290" height="400" rx="6" fill="#0d1117" stroke="#30363d"/>

  <text x="890" y="248" fill="#e6edf3" font-size="13" font-weight="600">Assignees</text>
  <circle cx="900" cy="278" r="10" fill="#bc8cff"/>
  <text x="918" y="282" fill="#e6edf3" font-size="13">maria</text>

  <line x1="890" y1="305" x2="1140" y2="305" stroke="#30363d"/>

  <text x="890" y="330" fill="#e6edf3" font-size="13" font-weight="600">Labels</text>
  <rect x="890" y="345" width="80" height="22" rx="11" fill="#a371f733" stroke="#a371f755"/>
  <text x="930" y="360" fill="#bc8cff" font-size="11" text-anchor="middle">feature</text>
  <rect x="978" y="345" width="60" height="22" rx="11" fill="#1f6feb33" stroke="#1f6feb55"/>
  <text x="1008" y="360" fill="#58a6ff" font-size="11" text-anchor="middle">P2</text>
  <rect x="890" y="372" width="90" height="22" rx="11" fill="#3fb95033" stroke="#3fb95055"/>
  <text x="935" y="387" fill="#3fb950" font-size="11" text-anchor="middle">backend</text>

  <line x1="890" y1="412" x2="1140" y2="412" stroke="#30363d"/>

  <text x="890" y="437" fill="#e6edf3" font-size="13" font-weight="600">Milestone</text>
  <text x="890" y="460" fill="#58a6ff" font-size="12">Q2 — Admin tooling</text>

  <line x1="890" y1="482" x2="1140" y2="482" stroke="#30363d"/>

  <text x="890" y="507" fill="#e6edf3" font-size="13" font-weight="600">Linked pull requests</text>
  <text x="890" y="528" fill="#7d8590" font-size="12">No PRs yet</text>

  <line x1="890" y1="550" x2="1140" y2="550" stroke="#30363d"/>

  <text x="890" y="575" fill="#e6edf3" font-size="13" font-weight="600">Development</text>
  <text x="890" y="595" fill="#58a6ff" font-size="12">Create a branch for this issue</text>

  <text x="600" y="680" fill="#3d444d" font-size="11" text-anchor="middle" font-family="monospace" letter-spacing="2">PLACEHOLDER · REPLACE WITH GITHUB SCREENSHOT</text>
</svg>
